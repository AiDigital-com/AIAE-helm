apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiae-presentation-builder-api.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aiae-presentation-builder-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "aiae-presentation-builder-api.selectorLabels" . | nindent 4 }}
