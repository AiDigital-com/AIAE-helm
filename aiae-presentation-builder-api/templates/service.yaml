apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiae-presentation-builder-api.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aiae-presentation-builder-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if gt (int .Values.internalPort) 0 }}
    # In-cluster only: the Ingress names service.port, never this one.
    - name: hub-internal
      port: {{ .Values.service.internalPort }}
      targetPort: hub-internal
      protocol: TCP
    {{- end }}
  selector:
    {{- include "aiae-presentation-builder-api.selectorLabels" . | nindent 4 }}
