nameOverride: operational-hub-api
environment: dev
namespace: aiae-dev
deploymentRevision: ""

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

containerPort: 5000

serviceAccount:
  create: true
  annotations: {}

service:
  type: ClusterIP
  port: 80

config:
  PORT: "5000"
  MANAGEMENT_HEALTH_PROBES_ENABLED: "true"

# POSTGRES_USER and POSTGRES_PASSWORD are still projected as environment
# variables, but they no longer come from this application's own secret: they
# come from the RDS-managed secret below, which is their owner.
#
# The eks profile ignores them — it reads the credentials through the JDBC
# wrapper instead, because an environment variable cannot follow a rotation.
# They stay for one reason: a chart revision and an image tag are pinned
# separately, so the cluster can briefly run the previous image against this
# chart, and that image still expects them. Sourcing them from the owning
# secret keeps both images working while removing the duplicate that caused the
# outage. They can be dropped once no deployed image needs them.
secretEnv:
  POSTGRES_HOST: POSTGRES_HOST
  POSTGRES_PORT: POSTGRES_PORT
  POSTGRES_DB: POSTGRES_DB
  POSTGRES_USER: POSTGRES_USER
  POSTGRES_PASSWORD: POSTGRES_PASSWORD
  CLERK_PUBLISHABLE_KEY: CLERK_PUBLISHABLE_KEY
  CLERK_SECRET_KEY: CLERK_SECRET_KEY
  GOOGLE_SERVICE_ACCOUNT_JSON: GOOGLE_SERVICE_ACCOUNT_JSON

secretsManager:
  enabled: true
  awsSecretName: ""
  keys:
    - POSTGRES_HOST
    - POSTGRES_PORT
    - POSTGRES_DB
    - CLERK_PUBLISHABLE_KEY
    - CLERK_SECRET_KEY
    - GOOGLE_SERVICE_ACCOUNT_JSON
    # Credentials for the PostgreSQL metrics exporter. It is a separate pod and
    # cannot recover from a rotation the way the application can: it builds its
    # connection string once, at startup, from environment variables, and has no
    # refetch-and-retry path. So it must not depend on the password AWS rotates.
    #
    # These credentials are ours and never rotate, and they belong to a role that
    # can only read statistics (pg_monitor) rather than to the master user the
    # exporter used before — excessive privilege for something that reads
    # counters. Deliberately alphanumeric: the RDS-generated password contains
    # characters that appear to break the exporter's connection string, which is
    # the likeliest reason it had been failing authentication since 31 August
    # while still reporting pg_up = 1, leaving the deadlock rule blind.
    - EXPORTER_USER
    - EXPORTER_PASSWORD

  # The RDS-managed master user secret: the single owner of the database
  # credentials. AWS rotates it every seven days and that schedule cannot be
  # turned off while RDS manages the password, so nothing may hold a second
  # copy. A copy is what took this application down on 3 September 2026:
  # nothing updated it, and a pod holds its environment for its whole life, so
  # the stale value kept failing until someone intervened.
  #
  # Two consumers, both reading this same secret:
  #   * the application, through the AWS Advanced JDBC Wrapper, which refetches
  #     the secret and retries whenever PostgreSQL rejects a login. Its ARN
  #     reaches the application as DB_MASTER_SECRET_ID in the ConfigMap.
  #   * the Liquibase PreSync Job, through the files below. A Job pod is created
  #     fresh for every sync, so its mount is always current.
  #
  # awsSecretName is the secret ARN, from the Terraform output
  # rds_master_user_secret_arn. Keys map a field of the secret's JSON to the
  # file name it is projected as.
  databaseCredentialsSecret:
    awsSecretName: ""
    keys:
      username: POSTGRES_USER
      password: POSTGRES_PASSWORD

liquibase:
  enabled: true
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  activeDeadlineSeconds: 900
  backoffLimit: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  startupPath: /actuator/health/readiness
  livenessPath: /actuator/health/liveness
  readinessPath: /actuator/health/readiness
  startupFailureThreshold: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

ingress:
  enabled: false
  className: alb
  annotations: {}
  hosts: []
  tls: []
