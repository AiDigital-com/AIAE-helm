apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "operational-hub-api.name" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "operational-hub-api.labels" . | nindent 4 }}
data:
  {{- range $name, $value := .Values.config }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
  {{- with .Values.secretsManager.databaseCredentialsSecret }}
  {{- if .awsSecretName }}
  # Read by the eks profile's spring.datasource.hikari.data-source-properties
  # .secretsManagerSecretId, so the JDBC wrapper knows which secret holds the
  # database credentials. An ARN identifies a secret; it is not one.
  DB_MASTER_SECRET_ID: {{ .awsSecretName | quote }}
  {{- end }}
  {{- end }}
