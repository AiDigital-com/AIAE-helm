nameOverride: ""
environment: prod
namespace: platform-prod

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

containerPort: 5000

serviceAccount:
  create: true
  annotations: {}

service:
  type: ClusterIP
  port: 80

config:
  PORT: "5000"
  MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
  SPRING_LIQUIBASE_ENABLED: "false"

secretEnv: {}

secretsManager:
  enabled: false
  awsSecretName: ""
  keys: []

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  startupPath: /actuator/health/readiness
  livenessPath: /actuator/health/liveness
  readinessPath: /actuator/health/readiness
  startupFailureThreshold: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

ingress:
  enabled: false
  className: alb
  annotations: {}
  hosts: []
  tls: []
