env: prod
appProject: aiae
const:
  argoNamespace: argocd
  finalizer: resources-finalizer.argocd.argoproj.io
destination:
  server: ""
  namespace: aiae-prod
source:
  helmRepositoryUrl: ""
  versionsRepositoryUrl: ""
  # Raised 2026-10-21 from 046b536, which predates the chart gaining
  # PACING_ASSERTION_SECRET. The release of cb82094 put Hub code in production
  # that refuses to start without that variable, while the pinned chart did not
  # mount it: the new pod died with "APPLICATION FAILED TO START ...
  # app.external.pacing.assertion-secret is not set" while the two old pods kept
  # serving, so the rollout stalled rather than broke anything.
  #
  # Only operational-hub-api reads this pin - onboarding and Pacing have their
  # own - and the chart's only change across this range is the ten lines adding
  # that key, so nothing else moves with it.
  #
  # Raised 2026-11-05 from 5d10fa7 to fc628eb: the only chart change in that
  # range gives the Liquibase pod its own name label, so the HPA stops counting
  # it once metrics-server is installed (the sync otherwise fails on "missing
  # request for cpu in container liquibase"). Verified on DEV first.
  #
  # Raised 2026-11-23 from fc628eb to eaf1cff: the only chart change in that
  # range mounts PRESENTATIONS_ASSERTION_SECRET from AIAE-PRD/operational-hub,
  # which the Hub needs once PRESENTATIONS_MODE is http. Verified on DEV first.
  # The key must exist in that AWS secret before this syncs.
  chartRevision: "eaf1cff81aa37be00ab30bea77ad95b90eb3e851"
  operationalHubVersionsRevision: "af734b9a95eb1396c67ebcb6e7ad398ce78bb78d"
  # Chart revision this application was tested against. Separate from
  # chartRevision so Operational Hub's pin is never moved by this application.
  aiaeOnboardingChartRevision: "df9bd77192b95607d3d6d1557c4f89efde9112f0"
  # Updated by release-prod.yml on every production release.
  aiaeOnboardingVersionsRevision: "8cf9d0f421fe1a629c771517deeab522ca2fb235"
  # Chart revision Pacing was tested against. Its own key for the same reason as
  # the two above: raising a shared pin would re-sync a live application.
  paicingChartRevision: "01eb335bc0746d1e70cd807146e6cc6f03776057"
  # Updated by gitops-prod-deploy-manual.yml on every production release.
  paicingVersionsRevision: "d196ca45d1d67a96bc513e73591d7688fe975576"
  # Chart revision the Presentation Builder was tested against on DEV. Its own
  # key for the same reason as the ones above: raising a shared pin would
  # re-sync a live application that was never tested against the new chart.
  #
  # Raised 2026-11-23 from df9bd77 to eaf1cff: the only chart change in that
  # range mounts HUB_ASSERTION_SECRET from Presentation builder's PROD secret,
  # the key the Hub signs its Presentations calls with. Verified on DEV first.
  # The key must exist in that AWS secret before this syncs.
  presentationBuilderChartRevision: "eaf1cff81aa37be00ab30bea77ad95b90eb3e851"
  # Written by the Presentation Builder's production release. Never read while
  # services.presentationBuilderApi.enabled is false.
  presentationBuilderVersionsRevision: "f6c1c413aadca07355ef21d524e3b55c33885315"
services:
  operationalHubApi:
    enabled: true
    imageRepository: 125093118532.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/operational-hub-application
    liquibaseImageRepository: 125093118532.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/operational-hub-application
    iamRoleArn: arn:aws:iam::125093118532:role/aiae-operational-hub-prod-application
    secretName: AIAE-PRD/operational-hub
    databaseCredentialsSecretArn: arn:aws:secretsmanager:us-east-1:125093118532:secret:rds!db-d1ca1b96-3b43-4312-8f57-97aabfdc3b00-eJ14oK
    host: ""
    replicaCount: 2
    minReplicas: 2
    maxReplicas: 10
    config:
      SPRING_PROFILES_ACTIVE: eks
      PORT: "5000"
      MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
      AUTH_ALLOWED_EMAIL_DOMAIN: aidigital.com
      AUTH_AUTHORIZED_PARTIES: https://aiae-operational-hub.aidigital.tech
      OPH_SECURITY_CORS_ALLOWED_ORIGINS: https://aiae-operational-hub.aidigital.tech
      OPH_SECURITY_CSP_FRAME_ANCESTORS: "'self' https://aiae-operational-hub.aidigital.tech"
      BIGQUERY_ENABLED: "true"
      BIGQUERY_PROJECT_ID: aiae-493511
      BIGQUERY_STUB_ENABLED: "false"
      BIGQUERY_LOCATION: US
      BIGQUERY_DATASET: netsuite
      USAGE_LOG_ENVIRONMENT: prod
      # Pacing runs in this same namespace, so the call stays inside the
      # cluster: no trip out to the ALB and back, no dependency on the public
      # endpoint. The Service listens on 80 and forwards to dash-gate's 3000,
      # which is why no port appears here.
      #
      # The other PACING_* variables the Hub reads keep their compiled-in
      # defaults, as they do in DEV. The one value NOT here is the HMAC key both
      # sides sign with: it reaches this pod as PACING_ASSERTION_SECRET from
      # AIAE-PRD/operational-hub, and its twin is HUB_ASSERTION_SECRET in
      # AIAE-PRD/aiae-paicing. Verified identical on 2026-10-21; if they ever
      # diverge, Pacing answers 401 to every call and the symptom reads as a
      # broken integration rather than as a wrong key.
      PACING_BASE_URL: http://aiae-paicing-api.aiae-prod.svc.cluster.local
      # Presentation builder runs in this namespace too: the Service listens on
      # 80 and forwards to its 5000. No /api suffix - the Hub adds the
      # /api/v1/... paths itself.
      PRESENTATIONS_BASE_URL: http://aiae-presentation-builder-api.aiae-prod.svc.cluster.local
      # The Presentations tab and its admin call Presentation builder, signing
      # each call with PRESENTATIONS_ASSERTION_SECRET from AIAE-PRD/operational-hub;
      # its twin is HUB_ASSERTION_SECRET in Presentation builder's PROD secret.
      # The Hub refuses to start in this mode without that secret, and a Hub
      # image older than 55f44f7 refuses the mode itself.
      PRESENTATIONS_MODE: http
  aiaeOnboardingApi:
    enabled: true
    imageRepository: 125093118532.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/onboarding-platform-application
    liquibaseImageRepository: 125093118532.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/onboarding-platform-application
    iamRoleArn: arn:aws:iam::125093118532:role/aiae-onboarding-prod-application
    secretName: AIAE-PRD/aiae-onboarding
    databaseCredentialsSecretArn: arn:aws:secretsmanager:us-east-1:125093118532:secret:rds!db-ad3c8939-8383-4411-8ac7-ceed14b1a947-iktEIm
    host: ""
    # Chart defaults are already production-shaped (2 replicas, HPA 2-10,
    # PodDisruptionBudget enabled). Passed explicitly to match Operational Hub
    # and so the values file states the intent rather than implying it.
    #
    # Note: the HPA will not actually scale. No metrics-server is installed in
    # either cluster, so metrics.k8s.io is unavailable and every HPA in this
    # environment reports unknown targets. Operational Hub has the same gap.
    # The deployment therefore holds at 2 replicas under any load.
    replicaCount: 2
    minReplicas: 2
    maxReplicas: 10
    config:
      SPRING_PROFILES_ACTIVE: eks
      PORT: "5000"
      MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
      APP_SERVICE_NAME: aiae-onboarding
      # Matched EXACTLY against the JWT azp claim (ClerkJwtClaimsValidator uses
      # List.contains, no wildcards). The production Clerk instance is bound to
      # aidigital.tech, so this hostname is also the only origin login works on.
      # Both names are listed because azp is matched EXACTLY — ClerkJwtClaimsValidator
      # uses List.contains, no wildcards. The verification subdomain would otherwise
      # fail login with "Authorized party is not trusted" while looking like a
      # permissions problem.
      AUTH_AUTHORIZED_PARTIES: "https://aiae-onboarding.aidigital.tech,https://aiae-onboarding-new.aidigital.tech"
      AUTH_ALLOWED_EMAIL_DOMAIN: aidigital.com
      APP_SECURITY_CORS_ALLOWED_ORIGINS: "https://aiae-onboarding.aidigital.tech,https://aiae-onboarding-new.aidigital.tech"
      APP_SECURITY_CSP_FRAME_ANCESTORS: "'self' https://aiae-onboarding.aidigital.tech https://aiae-onboarding-new.aidigital.tech"
      # Object storage authenticates through IRSA: ACCESS_KEY_ID and
      # SECRET_ACCESS_KEY are deliberately absent so the AWS SDK default
      # provider chain resolves the projected web-identity token.
      STORAGE_ENABLED: "true"
      REGION: us-east-1
      BUCKET: aiae-onboarding-prod-materials-125093118532
      STORAGE_FORCE_PATH_STYLE: "false"
      # Plain S3 presigned GETs for the first production cut, matching what was
      # verified end to end in DEV. The Replit deployment served media through
      # a CloudFront key group instead; that can be added later without
      # downtime by creating the distribution and flipping these three values.
      #
      # Trade-off accepted knowingly: the migrated content includes a 152 MB
      # .mov, two 94/91 MB .mp4 and two 83 MB .gif embedded in lessons, which a
      # CDN would cache at the edge and S3 will re-transmit on every view.
      CLOUDFRONT_ENABLED: "false"
      # Presigned URLs are signed with the pod's temporary IRSA credentials and
      # cannot outlive that session, whatever the URL's own expiry claims.
      STORAGE_PRESIGN_GET_EXPIRES_SECONDS: "3600"
      OPENAI_ENABLED: "true"
      YOUTUBE_ENABLED: "true"
      USAGE_LOG_SERVICE_NAME: aiae-onboarding
      USAGE_LOG_ENVIRONMENT: prod
  paicingApi:
    # Enabled 2026-10-21, once gitops-prod-deploy-manual.yml had published real
    # production image tags (1.0.0-0801669dd221 and its three siblings) and
    # repinned paicingVersionsRevision at the versions commit carrying them.
    # Before that the pin held a placeholder, and enabling it would have pointed
    # the child Application at tags absent from this account's ECR: Argo CD would
    # have sat Degraded on ImagePullBackOff.
    enabled: true
    imageRepository: 125093118532.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/paicing-application
    iamRoleArn: arn:aws:iam::125093118532:role/aiae-paicing-prod-application
    # Separate role: only the migration Job may read the RDS master credentials.
    migrateIamRoleArn: arn:aws:iam::125093118532:role/aiae-paicing-prod-migrate
    secretName: AIAE-PRD/aiae-paicing
    databaseCredentialsSecretArn: arn:aws:secretsmanager:us-east-1:125093118532:secret:rds!db-9e05cb79-6677-4af8-b362-4b1bdbd55c36-TNSMWF
    host: ""
    # One, and not a tuning choice: the three containers share a ReadWriteOnce
    # volume, which only one node can mount. Unlike the other two applications
    # here, this one cannot be given a second replica.
    replicaCount: 1
    # Above the chart's 512Mi/1Gi on evidence: the largest production bodies
    # are ~130 MB of JSON and dash-gate builds them in-process (parsed object,
    # the string and the gzip all live at once), then keeps up to 128 MB of
    # gzip in its cache. 1Gi is what one pod needs at rest; 2Gi is the peak.
    appMemoryRequest: 1Gi
    appMemoryLimit: 2Gi
    storageClassName: ebs-gp3
    # 20Gi on evidence, not by analogy with DEV: the full legacy set of 1340
    # pacings occupies 2.5 GB there, 13% of the volume. allowVolumeExpansion is
    # on, so this can grow without recreating the claim.
    storageSize: 20Gi
    config:
      NODE_ENV: production
      # Node sizes its heap from the container limit on its own (about 512 MB
      # under 1Gi); with 2Gi it is told explicitly, leaving ~500 MB outside the
      # heap for the gzip cache Buffers and file reads.
      NODE_OPTIONS: "--max-old-space-size=1536"
      PORT: "3000"
      DASH_ROOT: /dashboards
      DATA_DIR: /dashboards/data
      # Loopback: the three containers share a network namespace. Without these
      # dash-gate would look for the Docker Compose service names.
      BQ_FETCHER_URL: http://127.0.0.1:3200/fetch
      PACING_BUILDER_BASE_URL: http://127.0.0.1:3100
      BQ_PROJECT_ID: aiae-493511
      # n8n is decommissioned; every workflow runs in-process inside dash-gate.
      REFRESH_SOURCE: direct
      DAILY_BUILD_SOURCE: direct
      NS_MASTER_SOURCE: direct
      # ON from the start, by owner decision (2026-10-21): production runs its own
      # Slack bot and its own Google account, so it neither writes the old
      # system's sheets nor sends from its identity. What a separate bot does NOT
      # prevent is the same owner receiving two summaries while the old system is
      # still sending, and both systems spending the BigQuery budget on the same
      # fan-out. Fires at 18:15 Asia/Bangkok (11:15 UTC, no DST).
      DAILY_BUILD_SCHEDULE_ENABLED: "true"
      # Where every Slack link points: the Hub's pacing LIST, not one pacing.
      HUB_BASE_URL: https://aiae-operational-hub.aidigital.tech
      # Operational telemetry, not user-facing: an owner's own pacing summary is a
      # DM from personal-summary.mjs and never touches a channel. The ids are read
      # from the environment precisely so DEV and PROD cannot post into each
      # other's workspace - there is no fallback id, and an unset variable means
      # "say nothing" (dash-gate/lib/slack-channels.mjs).
      #
      # The bot behind SLACK_BOT_TOKEN must be a member of both, or the post is
      # dropped: safeSlackPost swallows the error, so a missing invite looks like
      # silence rather than a failure.
      #
      #   logs    build finished, auto-complete, auto-archive
      #   errors  refresh threw, stale data, empty or unmapped sheet tab,
      #           delivery after flight end
      SLACK_CHANNEL_LOGS: C0CALL0H5RD
      SLACK_CHANNEL_ERRORS: C0CAZNHU03C
      # The address the Hub shows a user who must share a client spreadsheet with
      # this service. Production runs on its own Google account rather than
      # reusing the old system's mpo-pacing@, so this is NOT the address the old
      # system prints. The same account's credential is GOOGLE_SHEETS_OAUTH_JSON
      # in AIAE-PRD/aiae-paicing - a USER refresh token, not a service account,
      # because the Pacings folder lives in that account's own Drive.
      #
      # That account must be granted READ on what mpo-pacing@ reads today, or the
      # pacings depending on it lose that data at their next refresh: the
      # reference "Master" sheet (NSMapping / Margin / KPI, read by
      # reference-sync.mjs) and the client sheets used as a performance source -
      # six pacings on 2026-10-16. List them before the switch with
      #   SELECT dash_slug, config_json->'data'->'sheet'->>'spreadsheet_id'
      #   FROM access.pacings WHERE config_json->'data' ? 'sheet';
      # (docs/legacy-import.md, "Cutover checklist").
      SHEET_SOURCE_ACCOUNT_EMAIL: mpo-pacing-prod@aidigital.com
  presentationBuilderApi:
    # Enabled 2026-11-18 at the PROD cutover: the infrastructure is applied
    # (AIAE-aws-infra PRs #12-#14), release 1.0.0-f720c6c51678 is published and
    # pinned through presentationBuilderVersionsRevision, and the database holds
    # the merged Replit + DEV history, so Liquibase finds its changesets applied.
    enabled: true
    imageRepository: 125093118532.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/presentation-builder-application
    liquibaseImageRepository: 125093118532.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/presentation-builder-application
    iamRoleArn: arn:aws:iam::125093118532:role/aiae-presentation-builder-prod-application
    secretName: AIAE-PRD/aiae-presentation-builder
    databaseCredentialsSecretArn: arn:aws:secretsmanager:us-east-1:125093118532:secret:rds!db-b8b8d6ef-ca85-4bec-a077-7ffb72957feb-tfYKGm
    host: ""
    # Production-shaped, as for the other PROD applications: two replicas behind
    # a PodDisruptionBudget, so a node recycle never takes the service down.
    replicaCount: 2
    minReplicas: 2
    maxReplicas: 10
    podDisruptionBudgetEnabled: true
    config:
      SPRING_PROFILES_ACTIVE: eks
      PORT: "5000"
      MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
      APP_SERVICE_NAME: aiae-presentation-builder
      # Matched EXACTLY against the JWT azp claim: ClerkJwtClaimsValidator uses
      # List.contains, with no wildcards. The production Clerk instance is bound
      # to aidigital.tech, so this hostname is the only origin login works on.
      AUTH_AUTHORIZED_PARTIES: "https://aiae-presentation-builder.aidigital.tech"
      # The wildcard escape hatch exists for the ephemeral Replit preview
      # hostnames and must stay empty here, or the exact match above stops
      # being exact.
      AUTH_AUTHORIZED_PARTY_PATTERNS: ""
      AUTH_ALLOWED_EMAIL_DOMAIN: aidigital.com
      APP_SECURITY_CORS_ALLOWED_ORIGINS: "https://aiae-presentation-builder.aidigital.tech"
      APP_SECURITY_CSP_FRAME_ANCESTORS: "'self' https://aiae-presentation-builder.aidigital.tech"
      # ARN of the RDS-managed secret, read by the AWS Advanced JDBC Wrapper at
      # connection time so a rotation never reaches the application.
      # ARN of the RDS-managed secret, read by the AWS Advanced JDBC Wrapper at
      # connection time so a rotation never reaches the application.
      DB_MASTER_SECRET_ID: arn:aws:secretsmanager:us-east-1:125093118532:secret:rds!db-b8b8d6ef-ca85-4bec-a077-7ffb72957feb-tfYKGm
      # db.t3.small has a small max_connections budget that the migration Job
      # also draws on.
      DB_MAX_POOL_SIZE: "10"
      USAGE_LOG_SERVICE_NAME: aiae-presentation-builder
      USAGE_LOG_ENVIRONMENT: prod
      # Admin allow-list and the addresses every generated deck and sheet is
      # auto-shared with as a writer. Unchanged from the live Replit deployment.
      APP_ADMIN_EMAILS: alex.turner@aidigital.com
      SLIDES_SHARE_WITH_EMAILS: alex.turner@aidigital.com
      # ── Deck templates ───────────────────────────────────────────────────
      # PROD's own copies of the production templates, in the Presentation
      # Builder shared drive under PROD/Templates (folder
      # 1EdGExqzDjeqYZz_apSXWYX-dK-dFXCaE). They are Drive copies of the files
      # the application.yml defaults name, so every master-slide object id and
      # chart id those defaults carry stays valid; only the file ids change.
      #
      # Access: reports are copied with the signed-in user's Google token (the
      # service account is only the fallback), so every user must be able to
      # read these files. The shared drive grants aidigital.com reader and the
      # presentation-builder service account fileOrganizer, inherited by every
      # file here. An earlier attempt failed with 404 because the files it named
      # lacked exactly that access; check it before pointing at other files.
      #
      # The ids are one coherent group: the two MPO decks' linked charts were
      # relinked to the PROD chart workbooks below, and the application finds a
      # chart by the workbook it links to, so the MPO_* workbook ids must stay
      # PROD's whenever the MPO deck ids are PROD's. EOM_SLIDES_TEMPLATE_ID stays
      # unset so the EOM deck keeps falling back to SLIDES_TEMPLATE_ID.
      SLIDES_TEMPLATE_ID: 1cQEaxX_BpdnOh_gJqcFWnP2iiGEI0VZy-S611hKLsEU
      SHEETS_TEMPLATE_ID: 1_K-dRVVaGL1bqooih72KYqnIF8pbIm9OiCwA3EAZvug
      EOM_SHEETS_TEMPLATE_ID: 1EAPrRkSSEfenXEYpIrvlg0KUwDxcj7LbRI7VhNZI4VQ
      MPO_EOC_SLIDES_TEMPLATE_ID: 1gpRWg8W9EN_qmb3T_x8TpdxwQxSCyHxns5UYsFpsPgw
      MPO_EOM_SLIDES_TEMPLATE_ID: 1yx6Y9KhBG8T0Qxso7AziLTOXw-5VX6XtLuk8Knh_Rsw
      MPO_DAILY_CHART_TEMPLATE_SHEET_ID: 1a2uUTv1x705WDyVftsCZscfQJYnXU2UZq556YNZP8TI
      MPO_MONTHLY_CHART_TEMPLATE_SHEET_ID: 1JXz3eVd8v3WxOpY_tlhG9DMSoobtHTDPSE0Ab4ef_Lw
      MPO_DIST_CHART_TEMPLATE_SHEET_ID: 19tMzIcPqwlJBPQLF0nge_XN3sZVzuAQq6LDQtIJ6VUQ
      MPO_BREAKDOWN_AUD_SOURCE_SHEET_ID: 1YDcoOA5nhpKNrmfJ47U6nYVc9U-MA6AdpbgQEe6qJ-c
      MPO_BREAKDOWN_AUD_SEG_SOURCE_SHEET_ID: 12FcLOEGGcbW4ZyQVyUN7gaH7kwjd-yug9i1oQZ8YsE4
      MPO_BREAKDOWN_DEV_SOURCE_SHEET_ID: 1BEd8pQTaQAp9RODnZ50YdffMmHTvhQJvM3QPsrh3ni4
      # ── Standard deck chart workbooks ────────────────────────────────────
      # The PROD Template copy's linked charts were relinked to PROD's own copies
      # of their source workbooks (PROD/Templates/Template charts, folder
      # 1A9BhD9ZUyBzKWm-XEKwiu5A_R0wd6LgU). The application finds each chart on a
      # slide by the workbook it links to, so these ids must match the deck's
      # links exactly; a mismatch leaves the chart unfound.
      #
      # The per-slot maps have no ${...} placeholder in application.yml, so they
      # are overridden through Spring's relaxed environment binding: one entry
      # per map key, merged over the application.yml map.
      #
      # The device breakdown chart links to PROD's copy of "EOC - device
      # distribution" (verified 2026-11-18 on the PROD Template). Its old chart id 1497669750 no longer exists in any copy;
      # 2117834642 ("Device Split") is the chart the application already fell back
      # to. The breakdown slide finds its chart by the linked workbook, so this id
      # and the PROD Template's link must change together.
      BREAKDOWN_DEV_SOURCE_SHEET_ID: 1awumniW2lfU55mGiOnPhX_0QNyShzxiZETbdAuMvxrM
      BREAKDOWN_DEV_CHART_ID: "2117834642"
      BREAKDOWN_AUD_SOURCE_SHEET_ID: 12u8vg56H1cpFztrGubInQDzpasFJIlEBEFYd0xzyyXI
      EXTERNAL_GOOGLE_CHARTS_DAILYTEMPLATESHEETIDS_1: 1XvXuwoOCU9ezVW8EU041RcYzkDEwA5UdhuKtJK43yew
      EXTERNAL_GOOGLE_CHARTS_DAILYTEMPLATESHEETIDS_2: 1EAgXv7dLYr8eLcD0a7nglEA7xHAR7WaApOA0rfoRoRU
      EXTERNAL_GOOGLE_CHARTS_DAILYTEMPLATESHEETIDS_3: 18PxycZyHmJAI6u-eaoQHCSMGxj1PPVel5zXO7a7gi0w
      EXTERNAL_GOOGLE_CHARTS_DAILYTEMPLATESHEETIDS_4: 1mijOmQMgjoDMqjCVeNuvc4lEkhMPtmk2REwGXCkpKdk
      EXTERNAL_GOOGLE_CHARTS_DAILYTEMPLATESHEETIDS_5: 1zggM9kdFPJC0NM0hEIvU_w090VedfQmHpZD3GTPgrl4
      EXTERNAL_GOOGLE_CHARTS_DAILYTEMPLATESHEETIDS_6: 1FC1YT_oLpyGjj9H22tFGSskxbr7IlHX8Z7N8kBVVEP0
      EXTERNAL_GOOGLE_CHARTS_DAILYTEMPLATESHEETIDS_7: 1T26Bt4-XCPfdRiXhMYeZeMei2eg3-muL3eNoFXiFOTo
      EXTERNAL_GOOGLE_CHARTS_DAILYTEMPLATESHEETIDS_8: 1ha5tjJoFW06pR8lX5Iw9Za8GDlcyh40W3S6k27QUDEY
      EXTERNAL_GOOGLE_CHARTS_DAILYTEMPLATESHEETIDS_9: 1KI8HHTjXaYjTO69sg7W3U2AXFzXKMkjM4W8X9jTSWZE
      EXTERNAL_GOOGLE_CHARTS_DAILYTEMPLATESHEETIDS_10: 1jC3JFJzKe1DwEscVUuSeSuWqt1RMlMKqDZ-cBX4MrEk
      EXTERNAL_GOOGLE_CHARTS_DAILYTEMPLATESHEETIDS_11: 1TnN4_qSqpjq1bjcQaUjFcc66LW2llxw7XpKUjsmrm9A
      EXTERNAL_GOOGLE_CHARTS_DAILYTEMPLATESHEETIDS_12: 1Tlyz-srD5UAo1wvZNaetyN1JCvIIFLFZlFwqNyrci_I
      EXTERNAL_GOOGLE_CHARTS_DAILYTEMPLATESHEETIDS_13: 1rGEB-5vVybvGZ7IlTZVCDWmvroUPtunS0pm2Qan5wXQ
