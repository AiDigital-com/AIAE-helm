env: prod
appProject: aiae
const:
  argoNamespace: argocd
  finalizer: resources-finalizer.argocd.argoproj.io
destination:
  server: ""
  namespace: aiae-prod
source:
  helmRepositoryUrl: ""
  versionsRepositoryUrl: ""
  # Raised 2026-10-21 from 046b536, which predates the chart gaining
  # PACING_ASSERTION_SECRET. The release of cb82094 put Hub code in production
  # that refuses to start without that variable, while the pinned chart did not
  # mount it: the new pod died with "APPLICATION FAILED TO START ...
  # app.external.pacing.assertion-secret is not set" while the two old pods kept
  # serving, so the rollout stalled rather than broke anything.
  #
  # Only operational-hub-api reads this pin - onboarding and Pacing have their
  # own - and the chart's only change across this range is the ten lines adding
  # that key, so nothing else moves with it.
  chartRevision: "5d10fa722ecd3219f7b25cd7f80be7ef1b5bba96"
  operationalHubVersionsRevision: "ec276fad263e24cfc93ed5ca98534eb2e30f18b3"
  # Chart revision this application was tested against. Separate from
  # chartRevision so Operational Hub's pin is never moved by this application.
  aiaeOnboardingChartRevision: "0e2b1ee7f2d810360e7d2f3067d3d107e71b0726"
  # Updated by release-prod.yml on every production release.
  aiaeOnboardingVersionsRevision: "12b5e879600a482352c7ae6c65771c07a04f5d08"
  # Chart revision Pacing was tested against. Its own key for the same reason as
  # the two above: raising a shared pin would re-sync a live application.
  paicingChartRevision: "01eb335bc0746d1e70cd807146e6cc6f03776057"
  # Updated by gitops-prod-deploy-manual.yml on every production release.
  paicingVersionsRevision: "617b867843b665dcd8dea4f10b111409a923ce05"
services:
  operationalHubApi:
    enabled: true
    imageRepository: 125093118532.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/operational-hub-application
    liquibaseImageRepository: 125093118532.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/operational-hub-application
    iamRoleArn: arn:aws:iam::125093118532:role/aiae-operational-hub-prod-application
    secretName: AIAE-PRD/operational-hub
    databaseCredentialsSecretArn: arn:aws:secretsmanager:us-east-1:125093118532:secret:rds!db-d1ca1b96-3b43-4312-8f57-97aabfdc3b00-eJ14oK
    host: ""
    replicaCount: 2
    minReplicas: 2
    maxReplicas: 10
    config:
      SPRING_PROFILES_ACTIVE: eks
      PORT: "5000"
      MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
      AUTH_ALLOWED_EMAIL_DOMAIN: aidigital.com
      AUTH_AUTHORIZED_PARTIES: https://aiae-operational-hub.aidigital.tech
      OPH_SECURITY_CORS_ALLOWED_ORIGINS: https://aiae-operational-hub.aidigital.tech
      OPH_SECURITY_CSP_FRAME_ANCESTORS: "'self' https://aiae-operational-hub.aidigital.tech"
      BIGQUERY_ENABLED: "true"
      BIGQUERY_PROJECT_ID: aiae-493511
      BIGQUERY_STUB_ENABLED: "false"
      BIGQUERY_LOCATION: US
      BIGQUERY_DATASET: netsuite
      USAGE_LOG_ENVIRONMENT: prod
      # Pacing runs in this same namespace, so the call stays inside the
      # cluster: no trip out to the ALB and back, no dependency on the public
      # endpoint. The Service listens on 80 and forwards to dash-gate's 3000,
      # which is why no port appears here.
      #
      # The other PACING_* variables the Hub reads keep their compiled-in
      # defaults, as they do in DEV. The one value NOT here is the HMAC key both
      # sides sign with: it reaches this pod as PACING_ASSERTION_SECRET from
      # AIAE-PRD/operational-hub, and its twin is HUB_ASSERTION_SECRET in
      # AIAE-PRD/aiae-paicing. Verified identical on 2026-10-21; if they ever
      # diverge, Pacing answers 401 to every call and the symptom reads as a
      # broken integration rather than as a wrong key.
      PACING_BASE_URL: http://aiae-paicing-api.aiae-prod.svc.cluster.local
  aiaeOnboardingApi:
    enabled: true
    imageRepository: 125093118532.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/onboarding-platform-application
    liquibaseImageRepository: 125093118532.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/onboarding-platform-application
    iamRoleArn: arn:aws:iam::125093118532:role/aiae-onboarding-prod-application
    secretName: AIAE-PRD/aiae-onboarding
    databaseCredentialsSecretArn: arn:aws:secretsmanager:us-east-1:125093118532:secret:rds!db-ad3c8939-8383-4411-8ac7-ceed14b1a947-iktEIm
    host: ""
    # Chart defaults are already production-shaped (2 replicas, HPA 2-10,
    # PodDisruptionBudget enabled). Passed explicitly to match Operational Hub
    # and so the values file states the intent rather than implying it.
    #
    # Note: the HPA will not actually scale. No metrics-server is installed in
    # either cluster, so metrics.k8s.io is unavailable and every HPA in this
    # environment reports unknown targets. Operational Hub has the same gap.
    # The deployment therefore holds at 2 replicas under any load.
    replicaCount: 2
    minReplicas: 2
    maxReplicas: 10
    config:
      SPRING_PROFILES_ACTIVE: eks
      PORT: "5000"
      MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
      APP_SERVICE_NAME: aiae-onboarding
      # Matched EXACTLY against the JWT azp claim (ClerkJwtClaimsValidator uses
      # List.contains, no wildcards). The production Clerk instance is bound to
      # aidigital.tech, so this hostname is also the only origin login works on.
      # Both names are listed because azp is matched EXACTLY — ClerkJwtClaimsValidator
      # uses List.contains, no wildcards. The verification subdomain would otherwise
      # fail login with "Authorized party is not trusted" while looking like a
      # permissions problem.
      AUTH_AUTHORIZED_PARTIES: "https://aiae-onboarding.aidigital.tech,https://aiae-onboarding-new.aidigital.tech"
      AUTH_ALLOWED_EMAIL_DOMAIN: aidigital.com
      APP_SECURITY_CORS_ALLOWED_ORIGINS: "https://aiae-onboarding.aidigital.tech,https://aiae-onboarding-new.aidigital.tech"
      APP_SECURITY_CSP_FRAME_ANCESTORS: "'self' https://aiae-onboarding.aidigital.tech https://aiae-onboarding-new.aidigital.tech"
      # Object storage authenticates through IRSA: ACCESS_KEY_ID and
      # SECRET_ACCESS_KEY are deliberately absent so the AWS SDK default
      # provider chain resolves the projected web-identity token.
      STORAGE_ENABLED: "true"
      REGION: us-east-1
      BUCKET: aiae-onboarding-prod-materials-125093118532
      STORAGE_FORCE_PATH_STYLE: "false"
      # Plain S3 presigned GETs for the first production cut, matching what was
      # verified end to end in DEV. The Replit deployment served media through
      # a CloudFront key group instead; that can be added later without
      # downtime by creating the distribution and flipping these three values.
      #
      # Trade-off accepted knowingly: the migrated content includes a 152 MB
      # .mov, two 94/91 MB .mp4 and two 83 MB .gif embedded in lessons, which a
      # CDN would cache at the edge and S3 will re-transmit on every view.
      CLOUDFRONT_ENABLED: "false"
      # Presigned URLs are signed with the pod's temporary IRSA credentials and
      # cannot outlive that session, whatever the URL's own expiry claims.
      STORAGE_PRESIGN_GET_EXPIRES_SECONDS: "3600"
      OPENAI_ENABLED: "true"
      YOUTUBE_ENABLED: "true"
      USAGE_LOG_SERVICE_NAME: aiae-onboarding
      USAGE_LOG_ENVIRONMENT: prod
  paicingApi:
    # Enabled 2026-10-21, once gitops-prod-deploy-manual.yml had published real
    # production image tags (1.0.0-0801669dd221 and its three siblings) and
    # repinned paicingVersionsRevision at the versions commit carrying them.
    # Before that the pin held a placeholder, and enabling it would have pointed
    # the child Application at tags absent from this account's ECR: Argo CD would
    # have sat Degraded on ImagePullBackOff.
    enabled: true
    imageRepository: 125093118532.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/paicing-application
    iamRoleArn: arn:aws:iam::125093118532:role/aiae-paicing-prod-application
    # Separate role: only the migration Job may read the RDS master credentials.
    migrateIamRoleArn: arn:aws:iam::125093118532:role/aiae-paicing-prod-migrate
    secretName: AIAE-PRD/aiae-paicing
    databaseCredentialsSecretArn: arn:aws:secretsmanager:us-east-1:125093118532:secret:rds!db-9e05cb79-6677-4af8-b362-4b1bdbd55c36-TNSMWF
    host: ""
    # One, and not a tuning choice: the three containers share a ReadWriteOnce
    # volume, which only one node can mount. Unlike the other two applications
    # here, this one cannot be given a second replica.
    replicaCount: 1
    storageClassName: ebs-gp3
    # 20Gi on evidence, not by analogy with DEV: the full legacy set of 1340
    # pacings occupies 2.5 GB there, 13% of the volume. allowVolumeExpansion is
    # on, so this can grow without recreating the claim.
    storageSize: 20Gi
    config:
      NODE_ENV: production
      PORT: "3000"
      DASH_ROOT: /dashboards
      DATA_DIR: /dashboards/data
      # Loopback: the three containers share a network namespace. Without these
      # dash-gate would look for the Docker Compose service names.
      BQ_FETCHER_URL: http://127.0.0.1:3200/fetch
      PACING_BUILDER_BASE_URL: http://127.0.0.1:3100
      BQ_PROJECT_ID: aiae-493511
      # n8n is decommissioned; every workflow runs in-process inside dash-gate.
      REFRESH_SOURCE: direct
      DAILY_BUILD_SOURCE: direct
      NS_MASTER_SOURCE: direct
      # ON from the start, by owner decision (2026-10-21): production runs its own
      # Slack bot and its own Google account, so it neither writes the old
      # system's sheets nor sends from its identity. What a separate bot does NOT
      # prevent is the same owner receiving two summaries while the old system is
      # still sending, and both systems spending the BigQuery budget on the same
      # fan-out. Fires at 18:15 Asia/Bangkok (11:15 UTC, no DST).
      DAILY_BUILD_SCHEDULE_ENABLED: "true"
      # Where every Slack link points: the Hub's pacing LIST, not one pacing.
      HUB_BASE_URL: https://aiae-operational-hub.aidigital.tech
      # Operational telemetry, not user-facing: an owner's own pacing summary is a
      # DM from personal-summary.mjs and never touches a channel. The ids are read
      # from the environment precisely so DEV and PROD cannot post into each
      # other's workspace - there is no fallback id, and an unset variable means
      # "say nothing" (dash-gate/lib/slack-channels.mjs).
      #
      # The bot behind SLACK_BOT_TOKEN must be a member of both, or the post is
      # dropped: safeSlackPost swallows the error, so a missing invite looks like
      # silence rather than a failure.
      #
      #   logs    build finished, auto-complete, auto-archive
      #   errors  refresh threw, stale data, empty or unmapped sheet tab,
      #           delivery after flight end
      SLACK_CHANNEL_LOGS: C0CALL0H5RD
      SLACK_CHANNEL_ERRORS: C0CAZNHU03C
      # The address the Hub shows a user who must share a client spreadsheet with
      # this service. Production runs on its own Google account rather than
      # reusing the old system's mpo-pacing@, so this is NOT the address the old
      # system prints. The same account's credential is GOOGLE_SHEETS_OAUTH_JSON
      # in AIAE-PRD/aiae-paicing - a USER refresh token, not a service account,
      # because the Pacings folder lives in that account's own Drive.
      #
      # That account must be granted READ on what mpo-pacing@ reads today, or the
      # pacings depending on it lose that data at their next refresh: the
      # reference "Master" sheet (NSMapping / Margin / KPI, read by
      # reference-sync.mjs) and the client sheets used as a performance source -
      # six pacings on 2026-10-16. List them before the switch with
      #   SELECT dash_slug, config_json->'data'->'sheet'->>'spreadsheet_id'
      #   FROM access.pacings WHERE config_json->'data' ? 'sheet';
      # (docs/legacy-import.md, "Cutover checklist").
      SHEET_SOURCE_ACCOUNT_EMAIL: mpo-pacing-prod@aidigital.com
