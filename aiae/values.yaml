env: dev
appProject: aiae
const:
  argoNamespace: argocd
  finalizer: resources-finalizer.argocd.argoproj.io
destination:
  server: ""
  namespace: aiae-dev
source:
  helmRepositoryUrl: ""
  versionsRepositoryUrl: ""
  chartRevision: "5d10fa722ecd3219f7b25cd7f80be7ef1b5bba96"
  operationalHubVersionsRevision: "4adce30efee64f75f8e4229c23faedbff9ed589e"
  # Chart revision this application was tested against. Separate from
  # chartRevision so Operational Hub's pin is never moved by this application.
  aiaeOnboardingChartRevision: "0e2b1ee7f2d810360e7d2f3067d3d107e71b0726"
  # Updated by the AIAE-onboarding-platform DEV workflow on every deployment.
  aiaeOnboardingVersionsRevision: "52ea5fbb43c98a920cb77b66d1f031ffbc84d903"
  # Chart revision Pacing was tested against. Its own key for the same reason as
  # the one above: raising a shared pin would re-sync a live application.
  paicingChartRevision: "378beb1edf0b79050f15ee7c0fdfcc95b9ec74bf"
  # Updated by the AIAE-paicing DEV workflow on every deployment.
  paicingVersionsRevision: "a3686a2445cc606d547e6c580a8657b39b607c35"
  # Chart revision the Presentation Builder was tested against. Its own key for
  # the same reason as the two above: raising a shared pin would re-sync a live
  # application that was never tested against the new chart.
  presentationBuilderChartRevision: "5aa870c67a58bb293b4378d64f90c0fb30d5c7c8"
  # Updated by the AIAE-presentation-builder DEV workflow on every deployment.
  # The placeholder below is never read: the child application stays disabled
  # until that workflow has written a real one.
  presentationBuilderVersionsRevision: "dbf9ca541ffcb1f14ce27c2f4af4c6a5dabc27d7"
services:
  operationalHubApi:
    enabled: true
    imageRepository: 496336474487.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/operational-hub-application
    liquibaseImageRepository: 496336474487.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/operational-hub-application
    iamRoleArn: arn:aws:iam::496336474487:role/aiae-operational-hub-dev-application
    secretName: AIAE-DEV/operational-hub
    databaseCredentialsSecretArn: arn:aws:secretsmanager:us-east-1:496336474487:secret:rds!db-82eba1a9-9e5c-44ed-a520-8daf44a00eb3-3mlEJZ
    host: ""
    replicaCount: 1
    minReplicas: 1
    maxReplicas: 1
    config:
      SPRING_PROFILES_ACTIVE: eks
      PORT: "5000"
      MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
      AUTH_ALLOWED_EMAIL_DOMAIN: aidigital.com
      AUTH_AUTHORIZED_PARTIES: "https://dfjozbcz9mj59.cloudfront.net"
      OPH_SECURITY_CORS_ALLOWED_ORIGINS: "https://dfjozbcz9mj59.cloudfront.net"
      OPH_SECURITY_CSP_FRAME_ANCESTORS: "'self' https://dfjozbcz9mj59.cloudfront.net"
      BIGQUERY_ENABLED: "true"
      BIGQUERY_PROJECT_ID: aiae-493511
      BIGQUERY_STUB_ENABLED: "false"
      BIGQUERY_LOCATION: US
      BIGQUERY_DATASET: netsuite
      USAGE_LOG_ENVIRONMENT: dev
      # Pacing runs in this same namespace, so the call stays inside the
      # cluster: no trip out to the ALB and back, no dependency on the public
      # endpoint. The Service listens on 80 and forwards to dash-gate's 3000,
      # which is why no port appears here.
      PACING_BASE_URL: http://aiae-paicing-api.aiae-dev.svc.cluster.local
  aiaeOnboardingApi:
    enabled: true
    imageRepository: 496336474487.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/onboarding-platform-application
    liquibaseImageRepository: 496336474487.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/onboarding-platform-application
    iamRoleArn: arn:aws:iam::496336474487:role/aiae-onboarding-dev-application
    secretName: AIAE-DEV/aiae-onboarding
    databaseCredentialsSecretArn: arn:aws:secretsmanager:us-east-1:496336474487:secret:rds!db-7cdb25cb-2b5c-45f2-9e49-b7aca51c3cee-rNAJD5
    host: ""
    replicaCount: 1
    minReplicas: 1
    maxReplicas: 1
    podDisruptionBudgetEnabled: false
    config:
      SPRING_PROFILES_ACTIVE: eks
      PORT: "5000"
      MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
      APP_SERVICE_NAME: aiae-onboarding
      # Matched EXACTLY against the JWT azp claim (ClerkJwtClaimsValidator uses
      # List.contains, no wildcards). This is the generated CloudFront domain,
      # which is the DEV product URL.
      AUTH_AUTHORIZED_PARTIES: "https://d1tyi0qe1x4bft.cloudfront.net"
      AUTH_ALLOWED_EMAIL_DOMAIN: aidigital.com
      APP_SECURITY_CORS_ALLOWED_ORIGINS: "https://d1tyi0qe1x4bft.cloudfront.net"
      APP_SECURITY_CSP_FRAME_ANCESTORS: "'self' https://d1tyi0qe1x4bft.cloudfront.net"
      # Object storage authenticates through IRSA: ACCESS_KEY_ID and
      # SECRET_ACCESS_KEY are deliberately absent so the AWS SDK default
      # provider chain resolves the projected web-identity token.
      STORAGE_ENABLED: "true"
      REGION: us-east-1
      BUCKET: aiae-onboarding-dev-materials-496336474487
      # Real AWS S3 uses virtual-hosted-style addressing; path style is only for
      # S3-compatible third parties and is deprecated by AWS.
      STORAGE_FORCE_PATH_STYLE: "false"
      # DEV signs downloads with plain S3 presigned GETs, so no CloudFront key
      # group or private key is needed. Presigned URLs are signed with the pod's
      # temporary IRSA credentials and cannot outlive that session, hence one
      # hour rather than the 24-hour application default.
      CLOUDFRONT_ENABLED: "false"
      STORAGE_PRESIGN_GET_EXPIRES_SECONDS: "3600"
      OPENAI_ENABLED: "true"
      YOUTUBE_ENABLED: "true"
      # db.t4g.small has a small max_connections budget shared with the
      # migration Job; the application default of 50 is sized for PROD.
      DB_MAX_POOL_SIZE: "10"
      USAGE_LOG_SERVICE_NAME: aiae-onboarding
      USAGE_LOG_ENVIRONMENT: dev
  paicingApi:
    # Enabled after the first successful DEV workflow run published real image
    # tags; before that the versions file held bootstrap placeholders and Argo CD
    # would have sat Degraded on ImagePullBackOff.
    enabled: true
    imageRepository: 496336474487.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/paicing-application
    iamRoleArn: arn:aws:iam::496336474487:role/aiae-paicing-dev-application
    # Separate role: only the migration Job may read the RDS master credentials.
    migrateIamRoleArn: arn:aws:iam::496336474487:role/aiae-paicing-dev-migrate
    secretName: AIAE-DEV/aiae-paicing
    databaseCredentialsSecretArn: arn:aws:secretsmanager:us-east-1:496336474487:secret:rds!db-5cc8220b-6d20-43be-8b26-30baff23b034-mzNxZH
    host: ""
    # One, and not a tuning choice: the three containers share a ReadWriteOnce
    # volume, which only one node can mount.
    replicaCount: 1
    storageClassName: ebs-gp3
    storageSize: 20Gi
    config:
      NODE_ENV: production
      PORT: "3000"
      DASH_ROOT: /dashboards
      DATA_DIR: /dashboards/data
      # Loopback: the three containers share a network namespace. Without these
      # dash-gate would look for the Docker Compose service names.
      BQ_FETCHER_URL: http://127.0.0.1:3200/fetch
      PACING_BUILDER_BASE_URL: http://127.0.0.1:3100
      BQ_PROJECT_ID: aiae-493511
      # The in-process ports of the former n8n workflows. n8n is NOT deployed in
      # DEV, so no N8N_*_WEBHOOK_URL is set: the calls that still target it
      # (sheet-source, source-manager, workspace-log, cm360) fail softly —
      # callN8nWebhook returns false and never throws. personal-summary left
      # that list once it was ported too: the pacing summary is sent from
      # dash-gate itself now (lib/personal-summary.mjs), in-process, at the end
      # of every refresh.
      REFRESH_SOURCE: direct
      DAILY_BUILD_SOURCE: direct
      NS_MASTER_SOURCE: direct
      # ON since the Slack path was proven end to end here: a manual refresh
      # rebuilt a pacing and its owner got the summary. Until then this stayed
      # off because an unattended nightly BigQuery fan-out is not something to
      # switch on before anything downstream of it works — it would have spent
      # the query budget to deliver nothing.
      #
      # Nothing competes with it: n8n is not deployed here, and its own "Pacing
      # Daily Build" workflow was deleted on 2026-09-21. Fires at 18:15
      # Asia/Bangkok (11:15 UTC, no DST), refreshing every Live pacing and
      # sending each owner their summary.
      DAILY_BUILD_SCHEDULE_ENABLED: "true"
      SHEET_SOURCE_ACCOUNT_EMAIL: mpo-pacing@aidigital.com
      # Slack channels for operational telemetry: build results, failed
      # refreshes, sheet warnings. DEV has its own pair. There is no fallback
      # id — an unset variable means that message is simply not sent, never
      # "send it to whichever channel was hardcoded last"
      # (dash-gate/lib/slack-channels.mjs).
      SLACK_CHANNEL_LOGS: C0C4A7FERNY
      SLACK_CHANNEL_ERRORS: C0C46NS5CP8
      # Where every Slack link points. The Hub's pacing LIST, not one pacing:
      # the Hub reaches a pacing through router state rather than an address,
      # so there is no per-pacing URL to link to yet (dash-gate/lib/hub-links.mjs
      # explains why a made-up one would be worse than none — the Hub's router
      # redirects unknown paths to its home page, so a dead link looks alive).
      HUB_BASE_URL: https://dfjozbcz9mj59.cloudfront.net
  presentationBuilderApi:
    # Stays false until the first DEV workflow run publishes real image tags and
    # repins presentationBuilderVersionsRevision. Enabling it before that points
    # Argo CD at a tag that does not exist in ECR, and it sits Degraded on
    # ImagePullBackOff — which is what happened to the Onboarding Platform and to
    # Pacing, and why both were registered disabled first.
    enabled: false
    imageRepository: 496336474487.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/presentation-builder-application
    liquibaseImageRepository: 496336474487.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/presentation-builder-application
    iamRoleArn: arn:aws:iam::496336474487:role/aiae-presentation-builder-dev-application
    secretName: AIAE-DEV/aiae-presentation-builder
    databaseCredentialsSecretArn: arn:aws:secretsmanager:us-east-1:496336474487:secret:rds!db-e2a3bd26-1511-4b49-9f18-9d15af791936-995ytC
    host: ""
    replicaCount: 1
    minReplicas: 1
    maxReplicas: 1
    # A single-replica DEV deployment gains nothing from a PodDisruptionBudget,
    # and minAvailable=1 against 1 replica makes the pod non-evictable, which
    # blocks EKS Auto Mode from consolidating or recycling the node.
    podDisruptionBudgetEnabled: false
    config:
      SPRING_PROFILES_ACTIVE: eks
      PORT: "5000"
      MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
      APP_SERVICE_NAME: aiae-presentation-builder
      # Matched EXACTLY against the JWT azp claim: ClerkJwtClaimsValidator uses
      # List.contains, with no wildcards. This is the generated CloudFront
      # domain, which is the DEV product URL.
      AUTH_AUTHORIZED_PARTIES: "https://d1jhayzxfc8kbc.cloudfront.net"
      # The wildcard escape hatch exists for the ephemeral Replit preview
      # hostnames and must stay empty here, or the exact match above stops
      # being exact.
      AUTH_AUTHORIZED_PARTY_PATTERNS: ""
      AUTH_ALLOWED_EMAIL_DOMAIN: aidigital.com
      APP_SECURITY_CORS_ALLOWED_ORIGINS: "https://d1jhayzxfc8kbc.cloudfront.net"
      APP_SECURITY_CSP_FRAME_ANCESTORS: "'self' https://d1jhayzxfc8kbc.cloudfront.net"
      # ARN of the RDS-managed secret, read by the AWS Advanced JDBC Wrapper at
      # connection time so a rotation never reaches the application.
      DB_MASTER_SECRET_ID: arn:aws:secretsmanager:us-east-1:496336474487:secret:rds!db-e2a3bd26-1511-4b49-9f18-9d15af791936-995ytC
      # db.t3.small has a small max_connections budget that the migration Job
      # also draws on.
      DB_MAX_POOL_SIZE: "10"
      USAGE_LOG_SERVICE_NAME: aiae-presentation-builder
      USAGE_LOG_ENVIRONMENT: dev
      # Admin allow-list and the addresses every generated deck and sheet is
      # auto-shared with as a writer. Unchanged from the live Replit deployment.
      APP_ADMIN_EMAILS: alex.turner@aidigital.com
      SLIDES_SHARE_WITH_EMAILS: alex.turner@aidigital.com
      # ── Deck templates ───────────────────────────────────────────────────
      # The NEW template set, which is what DEV is for. On Replit the workspace
      # and the published app share one environment, so these could only be
      # tested by having scripts/lib/deploy-env.sh overwrite them at boot for the
      # published app. Here DEV and PROD are separate ConfigMaps, so the new deck
      # can be exercised without any chance of reaching production: PROD will
      # carry the previous ids until this one is signed off.
      SLIDES_TEMPLATE_ID: 15ryPctwlmTy2uCpjrVjR1kVJErnpvQ9wXnF7IAka-OM
      TACTIC_MASTER_SLIDE_OBJECT_ID: p8
      THOUGHTS_MASTER_SLIDE_OBJECT_ID: g3f6fd96d9b2_1_0
      # One chart-source workbook per type, each with its own in-sheet chart id.
      # The workbook id doubles as the key that finds that chart on a duplicated
      # tactic slide, so the three must stay three distinct files.
      DAILY_CHART_TEMPLATE_SHEET_ID: 1LjtiI83T_0-v64CsoANTIjDzinipBk5ELe7NVzO5r2A
      MONTHLY_CHART_TEMPLATE_SHEET_ID: 1r4aI3ToKfZ7W_TfVNokdShp91mXFIiA2eLy8PmTx4oI
      DIST_CHART_TEMPLATE_SHEET_ID: 1fzG6Uuu2U1E3w0lnXGKO0TERYb59LkmSNSBgVR9DPtw
      DAILY_CHART_ID_IN_SHEET: "510717191"
      MONTHLY_CHART_ID_IN_SHEET: "510717191"
      DIST_CHART_ID_IN_SHEET: "1431807138"
      # Master slides duplicated per tactic for the Step-3 breakdown sections.
      BREAKDOWN_MASTER_SLIDE_TP: p9
      BREAKDOWN_MASTER_SLIDE_CA: p10
      BREAKDOWN_MASTER_SLIDE_AUD: p11
      BREAKDOWN_MASTER_SLIDE_GEO: p13
      BREAKDOWN_MASTER_SLIDE_DEV: p14
      # Platform group slides and their 7-row tables, deleted or row-trimmed by
      # the tactic trim when a group has no tactics left.
      RESULTS_SLIDE_OBJECT_ID_1: p7
      RESULTS_SLIDE_OBJECT_ID_2: g3f6fd96d9b2_1_139
      RESULTS_SLIDE_OBJECT_ID_3: g3f6fd96d9b2_1_153
      RESULTS_SLIDE_OBJECT_ID_4: g3f6fd96d9b2_1_167
      SUMMARY_TABLE_OBJECT_ID_1: p7_i467
      SUMMARY_TABLE_OBJECT_ID_2: g3f6fd96d9b2_1_143
      SUMMARY_TABLE_OBJECT_ID_3: g3f6fd96d9b2_1_157
      SUMMARY_TABLE_OBJECT_ID_4: g3f6fd96d9b2_1_171
      # The EOM deck and the workbook that fills it. These two are a pair: the
      # workbook carries the tables slides 3-8 of this deck read, and pointing
      # the deck at the previous workbook is what left the Sheet step cloning
      # the wrong file for a commit.
      EOM_SLIDES_TEMPLATE_ID: 1ZUPEEEnKdbgehkSmyok6usc5onXO04YHkQelbsmJdC0
      EOM_SHEETS_TEMPLATE_ID: 1zQOMfuHDqfJedcQl4IzHonRpBfPtMdLtivwlxWV9Yjo
      # Empty on purpose: the two ids the application defaults to are EOC-template
      # ids, and p6/p17 exist in the EOM template as unrelated slides — keeping
      # them would delete two arbitrary slides from every EOM deck.
      EOM_DROP_SLIDE_OBJECT_IDS: ""
      # The one slide the EOM template carries that must never ship: the divider
      # standing in front of the breakdown masters. Matched by text because it
      # has no token to key on.
      EOM_DROP_SLIDE_TITLES: SLIDES LIBRARY
      # Per-tactic breakdown charts, keyed by series. The audience slide carries
      # two charts, so age and top-segments each get their own workbook.
      BREAKDOWN_AUD_SOURCE_SHEET_ID: 1K4XeQcIngAoYckwim7DWpA14pWC4ssuSypuUccA8kQc
      BREAKDOWN_AUD_CHART_ID: "522266257"
      BREAKDOWN_AUD_SEG_SOURCE_SHEET_ID: 1PAurz6x7NC_35A1HKllbhSgfk5wvncN_oRnFraGy2r8
      BREAKDOWN_AUD_SEG_CHART_ID: "522266257"
      BREAKDOWN_DEV_SOURCE_SHEET_ID: 1kDdh68zWxrujlW0dbhsNmLS5xu9jT3KbfjtbvbRBVvc
      BREAKDOWN_DEV_CHART_ID: "522266257"
