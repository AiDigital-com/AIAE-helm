env: dev
appProject: aiae
const:
  argoNamespace: argocd
  finalizer: resources-finalizer.argocd.argoproj.io
destination:
  server: ""
  namespace: aiae-dev
source:
  helmRepositoryUrl: ""
  versionsRepositoryUrl: ""
  chartRevision: "8b3d95a8376dfffb7a2f9291f6abfcefaaf7ce33"
  operationalHubVersionsRevision: "c54cdd793268b77c65fcee3bc90932c9f04b8de7"
  # Chart revision this application was tested against. Separate from
  # chartRevision so Operational Hub's pin is never moved by this application.
  aiaeOnboardingChartRevision: "0e2b1ee7f2d810360e7d2f3067d3d107e71b0726"
  # Updated by the AIAE-onboarding-platform DEV workflow on every deployment.
  aiaeOnboardingVersionsRevision: "52ea5fbb43c98a920cb77b66d1f031ffbc84d903"
  # Chart revision Pacing was tested against. Its own key for the same reason as
  # the one above: raising a shared pin would re-sync a live application.
  paicingChartRevision: "07fac74d1a4d1c48e683b60561346b5630c6dff7"
  # Updated by the AIAE-paicing DEV workflow on every deployment.
  paicingVersionsRevision: "5cda4519900ed8ce69676092b357981c363b90b7"
services:
  operationalHubApi:
    enabled: true
    imageRepository: 496336474487.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/operational-hub-application
    liquibaseImageRepository: 496336474487.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/operational-hub-application
    iamRoleArn: arn:aws:iam::496336474487:role/aiae-operational-hub-dev-application
    secretName: AIAE-DEV/operational-hub
    databaseCredentialsSecretArn: arn:aws:secretsmanager:us-east-1:496336474487:secret:rds!db-82eba1a9-9e5c-44ed-a520-8daf44a00eb3-3mlEJZ
    host: ""
    replicaCount: 1
    minReplicas: 1
    maxReplicas: 1
    config:
      SPRING_PROFILES_ACTIVE: eks
      PORT: "5000"
      MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
      AUTH_ALLOWED_EMAIL_DOMAIN: aidigital.com
      AUTH_AUTHORIZED_PARTIES: "https://dfjozbcz9mj59.cloudfront.net"
      OPH_SECURITY_CORS_ALLOWED_ORIGINS: "https://dfjozbcz9mj59.cloudfront.net"
      OPH_SECURITY_CSP_FRAME_ANCESTORS: "'self' https://dfjozbcz9mj59.cloudfront.net"
      BIGQUERY_ENABLED: "true"
      BIGQUERY_PROJECT_ID: aiae-493511
      BIGQUERY_STUB_ENABLED: "false"
      BIGQUERY_LOCATION: US
      BIGQUERY_DATASET: netsuite
      USAGE_LOG_ENVIRONMENT: dev
  aiaeOnboardingApi:
    enabled: true
    imageRepository: 496336474487.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/onboarding-platform-application
    liquibaseImageRepository: 496336474487.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/onboarding-platform-application
    iamRoleArn: arn:aws:iam::496336474487:role/aiae-onboarding-dev-application
    secretName: AIAE-DEV/aiae-onboarding
    databaseCredentialsSecretArn: arn:aws:secretsmanager:us-east-1:496336474487:secret:rds!db-7cdb25cb-2b5c-45f2-9e49-b7aca51c3cee-rNAJD5
    host: ""
    replicaCount: 1
    minReplicas: 1
    maxReplicas: 1
    podDisruptionBudgetEnabled: false
    config:
      SPRING_PROFILES_ACTIVE: eks
      PORT: "5000"
      MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
      APP_SERVICE_NAME: aiae-onboarding
      # Matched EXACTLY against the JWT azp claim (ClerkJwtClaimsValidator uses
      # List.contains, no wildcards). This is the generated CloudFront domain,
      # which is the DEV product URL.
      AUTH_AUTHORIZED_PARTIES: "https://d1tyi0qe1x4bft.cloudfront.net"
      AUTH_ALLOWED_EMAIL_DOMAIN: aidigital.com
      APP_SECURITY_CORS_ALLOWED_ORIGINS: "https://d1tyi0qe1x4bft.cloudfront.net"
      APP_SECURITY_CSP_FRAME_ANCESTORS: "'self' https://d1tyi0qe1x4bft.cloudfront.net"
      # Object storage authenticates through IRSA: ACCESS_KEY_ID and
      # SECRET_ACCESS_KEY are deliberately absent so the AWS SDK default
      # provider chain resolves the projected web-identity token.
      STORAGE_ENABLED: "true"
      REGION: us-east-1
      BUCKET: aiae-onboarding-dev-materials-496336474487
      # Real AWS S3 uses virtual-hosted-style addressing; path style is only for
      # S3-compatible third parties and is deprecated by AWS.
      STORAGE_FORCE_PATH_STYLE: "false"
      # DEV signs downloads with plain S3 presigned GETs, so no CloudFront key
      # group or private key is needed. Presigned URLs are signed with the pod's
      # temporary IRSA credentials and cannot outlive that session, hence one
      # hour rather than the 24-hour application default.
      CLOUDFRONT_ENABLED: "false"
      STORAGE_PRESIGN_GET_EXPIRES_SECONDS: "3600"
      OPENAI_ENABLED: "true"
      YOUTUBE_ENABLED: "true"
      # db.t4g.small has a small max_connections budget shared with the
      # migration Job; the application default of 50 is sized for PROD.
      DB_MAX_POOL_SIZE: "10"
      USAGE_LOG_SERVICE_NAME: aiae-onboarding
      USAGE_LOG_ENVIRONMENT: dev
  paicingApi:
    # Enabled after the first successful DEV workflow run published real image
    # tags; before that the versions file held bootstrap placeholders and Argo CD
    # would have sat Degraded on ImagePullBackOff.
    enabled: true
    imageRepository: 496336474487.dkr.ecr.us-east-1.amazonaws.com/aidigital.aiae-projects/paicing-application
    iamRoleArn: arn:aws:iam::496336474487:role/aiae-paicing-dev-application
    # Separate role: only the migration Job may read the RDS master credentials.
    migrateIamRoleArn: arn:aws:iam::496336474487:role/aiae-paicing-dev-migrate
    secretName: AIAE-DEV/aiae-paicing
    databaseCredentialsSecretArn: arn:aws:secretsmanager:us-east-1:496336474487:secret:rds!db-5cc8220b-6d20-43be-8b26-30baff23b034-mzNxZH
    host: ""
    # One, and not a tuning choice: the three containers share a ReadWriteOnce
    # volume, which only one node can mount.
    replicaCount: 1
    storageClassName: ebs-gp3
    storageSize: 20Gi
    config:
      NODE_ENV: production
      PORT: "3000"
      DASH_ROOT: /dashboards
      DATA_DIR: /dashboards/data
      # Loopback: the three containers share a network namespace. Without these
      # dash-gate would look for the Docker Compose service names.
      BQ_FETCHER_URL: http://127.0.0.1:3200/fetch
      PACING_BUILDER_BASE_URL: http://127.0.0.1:3100
      BQ_PROJECT_ID: aiae-493511
      # The in-process ports of the former n8n workflows. n8n is NOT deployed in
      # DEV, so no N8N_*_WEBHOOK_URL is set: the calls that still target it
      # (sheet-source, source-manager, personal-summary, workspace-log, cm360)
      # fail softly — callN8nWebhook returns false and never throws.
      REFRESH_SOURCE: direct
      DAILY_BUILD_SOURCE: direct
      NS_MASTER_SOURCE: direct
      # OFF. Nothing competes with an in-process cron here, but an unattended
      # nightly BigQuery fan-out is not switched on silently.
      DAILY_BUILD_SCHEDULE_ENABLED: "false"
      SHEET_SOURCE_ACCOUNT_EMAIL: mpo-pacing@aidigital.com
