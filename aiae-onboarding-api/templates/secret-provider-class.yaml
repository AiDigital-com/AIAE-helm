{{- if .Values.secretsManager.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "aiae-onboarding-api.name" . }}-spc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aiae-onboarding-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync,Sync
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  provider: aws
  secretObjects:
    - secretName: {{ include "aiae-onboarding-api.secretName" . }}
      type: Opaque
      data:
        {{- range $secretKey := .Values.secretsManager.keys }}
        - objectName: {{ $secretKey }}
          key: {{ $secretKey }}
        {{- end }}
        {{- with .Values.secretsManager.databaseCredentialsSecret }}
        {{- if .awsSecretName }}
        {{- range $field, $alias := .keys }}
        - objectName: {{ $alias }}
          key: {{ $alias }}
        {{- end }}
        {{- end }}
        {{- end }}
  parameters:
    objects: |
      - objectName: "{{ .Values.secretsManager.awsSecretName }}"
        objectType: "secretsmanager"
        jmesPath:
          {{- range $secretKey := .Values.secretsManager.keys }}
          - path: {{ $secretKey }}
            objectAlias: {{ $secretKey }}
          {{- end }}
      {{- with .Values.secretsManager.databaseCredentialsSecret }}
      {{- if .awsSecretName }}
      - objectName: "{{ .awsSecretName }}"
        objectType: "secretsmanager"
        jmesPath:
          {{- range $field, $alias := .keys }}
          - path: {{ $field }}
            objectAlias: {{ $alias }}
          {{- end }}
      {{- end }}
      {{- end }}
{{- end }}
