{{- if .Values.secretsManager.enabled }}
# TWO SecretProviderClasses, and the split is load-bearing.
#
# The application's IAM role cannot read the RDS master secret — by design, so
# a pod that may only read and write rows cannot also alter the schema. The
# Secrets Store CSI driver fetches every object named in a class using the
# POD's identity, so naming the master secret in the application's class would
# not merely be untidy: the fetch would be denied and the pod would never start.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "aiae-paicing-api.name" . }}-spc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aiae-paicing-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync,Sync
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  provider: aws
  secretObjects:
    - secretName: {{ include "aiae-paicing-api.secretName" . }}
      type: Opaque
      data:
        {{- range $secretKey := .Values.secretsManager.keys }}
        - objectName: {{ $secretKey }}
          key: {{ $secretKey }}
        {{- end }}
  parameters:
    objects: |
      - objectName: "{{ .Values.secretsManager.awsSecretName }}"
        objectType: "secretsmanager"
        jmesPath:
          {{- range $secretKey := .Values.secretsManager.keys }}
          - path: {{ $secretKey }}
            objectAlias: {{ $secretKey }}
          {{- end }}
{{- if .Values.migrate.enabled }}
---
# The migration Job's class: the application secret PLUS the RDS master
# credentials. Only this Job's service account has an IAM role that can read
# the second one.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "aiae-paicing-api.migrateName" . }}-spc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aiae-paicing-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  provider: aws
  secretObjects:
    - secretName: {{ include "aiae-paicing-api.migrateSecretName" . }}
      type: Opaque
      data:
        {{- range $secretKey := .Values.secretsManager.keys }}
        - objectName: {{ $secretKey }}
          key: {{ $secretKey }}
        {{- end }}
        {{- with .Values.secretsManager.databaseCredentialsSecret }}
        {{- if .awsSecretName }}
        {{- range $field, $alias := .keys }}
        - objectName: {{ $alias }}
          key: {{ $alias }}
        {{- end }}
        {{- end }}
        {{- end }}
  parameters:
    objects: |
      - objectName: "{{ .Values.secretsManager.awsSecretName }}"
        objectType: "secretsmanager"
        jmesPath:
          {{- range $secretKey := .Values.secretsManager.keys }}
          - path: {{ $secretKey }}
            objectAlias: {{ $secretKey }}
          {{- end }}
      {{- with .Values.secretsManager.databaseCredentialsSecret }}
      {{- if .awsSecretName }}
      - objectName: "{{ .awsSecretName }}"
        objectType: "secretsmanager"
        jmesPath:
          {{- range $field, $alias := .keys }}
          - path: {{ $field }}
            objectAlias: {{ $alias }}
          {{- end }}
      {{- end }}
      {{- end }}
{{- end }}
{{- end }}
